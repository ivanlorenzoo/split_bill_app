name: Test & Deploy

on:
  push:
    branches: [main]

# Allow GitHub Actions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: split-bill-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: split-bill-app

      - name: Run tests
        run: npm test
        working-directory: split-bill-app

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: split-bill-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
